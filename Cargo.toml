[package]
name = "rtex"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Command-line TeX engine that turns plain-TeX-style documents into PDF, built on rtex-core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hebertcisco/rtex"
readme = "README.md"
keywords = ["tex", "typesetting", "pdf", "cli"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[[bin]]
name = "rtex"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.47"
miniz_oxide = "0.9"
png = "0.17"
rtex-core = { version = "0.2.2", path = "../rtex-core" }
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
